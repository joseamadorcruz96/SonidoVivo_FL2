# Configuracion aislada H2 para pruebas automatizadas sin PostgreSQL externo
spring.application.name=ms-ventas-boletas
spring.datasource.url=jdbc:h2:mem:ventas_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.flyway.enabled=false
ms.inventario.url=http://localhost:8082
ms.inventario.ventas-key=test-ventas-key
ms.usuarios.url=http://localhost:8081
jwt.secret=TestOnlyJwtSecretKeyNotUsedInProduction2026SonidoVivo123456
