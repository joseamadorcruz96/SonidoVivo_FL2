spring.application.name=ms-ventas-boletas
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${VENTAS_DB_URL}
spring.datasource.username=${VENTAS_DB_USERNAME}
spring.datasource.password=${VENTAS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.schemas=ventas
spring.flyway.default-schema=ventas
spring.flyway.create-schemas=true

ms.inventario.url=${MS_INVENTARIO_URL:http://localhost:8082}
ms.inventario.ventas-key=${VENTAS_SERVICE_KEY:}
ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}

jwt.secret=${JWT_SECRET}
