server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**

            - id: catalogo
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/productos/**,/api/v1/categorias/**

            - id: ventas
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/boletas/**