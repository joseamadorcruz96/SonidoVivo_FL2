server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios
              uri: ${MS_USUARIOS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**

            - id: catalogo
              uri: ${MS_CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/productos/**,/api/v1/categorias/**

            - id: ventas
              uri: ${MS_VENTAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/boletas/**
