spring.application.name=ms-catalogo-inventario
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=catalogo
spring.flyway.default-schema=catalogo
spring.flyway.create-schemas=true

jwt.secret=${JWT_SECRET}
ventas.service-key=${VENTAS_SERVICE_KEY:}
