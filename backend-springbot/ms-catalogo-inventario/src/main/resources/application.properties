spring.application.name=ms-catalogo-inventario
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${INVENTARIO_DB_URL}
spring.datasource.username=${INVENTARIO_DB_USERNAME}
spring.datasource.password=${INVENTARIO_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.schemas=inventario
spring.flyway.default-schema=inventario
spring.flyway.create-schemas=true

jwt.secret=${JWT_SECRET}
ventas.service-key=${VENTAS_SERVICE_KEY:}
