# Configuracion aislada H2 para pruebas automatizadas sin PostgreSQL externo
spring.application.name=ms-catalogo-inventario
spring.datasource.url=jdbc:h2:mem:inventario_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=TestOnlyJwtSecretKeyNotUsedInProduction2026SonidoVivo123456
ventas.service-key=test-ventas-key
