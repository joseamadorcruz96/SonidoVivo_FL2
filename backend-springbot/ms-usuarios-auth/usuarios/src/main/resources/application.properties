# 1. Identidad, Puerto y carga opcional de .env local
spring.application.name=usuarios
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

# 2. Conexión a Base de Datos H2 (persistente en carpeta ./data)
spring.datasource.url=jdbc:h2:file:./data/SonidoVivo_Usuarios_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Consola H2 en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 5. Propiedades personalizadas para JWT (inyectadas por variable de entorno o .env local)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}