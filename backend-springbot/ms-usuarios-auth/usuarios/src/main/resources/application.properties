# 1. Identidad, Puerto y carga opcional de .env local
spring.application.name=usuarios
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

# 2. Conexión a Supabase PostgreSQL (Session Pooler, esquema aislado)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4

# 3. Hibernate / JPA (validación estricta contra el esquema administrado por Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=usuarios
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Flyway (migraciones versionadas en el esquema usuarios)
spring.flyway.enabled=true
spring.flyway.schemas=usuarios
spring.flyway.default-schema=usuarios
spring.flyway.create-schemas=true

# 5. Propiedades personalizadas para JWT (inyectadas por variable de entorno o .env local)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}