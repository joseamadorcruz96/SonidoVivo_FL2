<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sonido Vivo</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos Personalizados y Variables Corporativas -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Scripts necesarios (app.js para el menú y registro.js para el formulario) -->
    <script src="js/app.js" defer></script>
    <script src="js/registro.js" defer></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-sonido-vivo" aria-label="Navegación principal">
            <div class="container">
                <!-- Logotipo Oficial Sonido Vivo -->
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/logo.svg" alt="Sonido Vivo - Instrumentos & Audio">
                </a>

                <!-- Botón Hamburguesa Responsivo para Móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion"
                    aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Enlaces de Navegación del Sitio -->
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>

                    <!-- Acciones Rápidas: Carrito y Menú de Sesión -->
                    <div class="d-flex align-items-center gap-3">
                        <a href="carrito.html" class="btn-carrito-nav" id="boton-carrito-nav"
                            title="Ver carrito de compras">
                            <span>🛒 Carrito</span>
                            <span id="contador-carrito" class="badge-carrito">0</span>
                        </a>
                        
                        <!-- Contenedor dinámico para botones de sesión -->
                        <div id="menu-sesion" class="d-flex gap-2"></div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
        <!-- Tarjeta de Registro adaptada al estilo Login -->
        <div class="card shadow-lg" style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); width: 100%; max-width: 450px; border-radius: var(--radius-lg);">
            <div class="card-body p-4 p-md-5">
                
                <!-- Encabezado del Formulario -->
                <div class="text-center mb-4">
                    <img src="assets/img/logo.svg" alt="Sonido Vivo Logo" style="height: 45px;" class="mb-3">
                    <h2 class="fw-bold" style="color: var(--text-main); font-family: var(--font-heading);">Crear Cuenta</h2>
                    <p class="text-secondary small">Únete a Sonido Vivo para acceder a nuestro catálogo exclusivo.</p>
                </div>

                <!-- Formulario -->
                <form id="form-registro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold" style="color: var(--text-main);">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required 
                               style="background-color: var(--bg-body); border: 1px solid var(--border-subtle); color: var(--text-main);">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold" style="color: var(--text-main);">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required 
                               style="background-color: var(--bg-body); border: 1px solid var(--border-subtle); color: var(--text-main);">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold" style="color: var(--text-main);">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required 
                               style="background-color: var(--bg-body); border: 1px solid var(--border-subtle); color: var(--text-main);">
                    </div>

                    <div class="mb-4">
                        <label for="confirmar-password" class="form-label fw-semibold" style="color: var(--text-main);">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirmar-password" placeholder="Repite tu contraseña" required 
                               style="background-color: var(--bg-body); border: 1px solid var(--border-subtle); color: var(--text-main);">
                    </div>
                    
                    <!-- Botón de Registro (Clase dorada) -->
                    <button type="submit" class="btn btn-hero-gold w-100 mb-3">
                        Registrarme
                    </button>
                    
                    <!-- Enlace para volver al login -->
                    <div class="text-center mt-3">
                        <hr style="border-color: var(--border-subtle);">
                        <p class="small text-secondary mb-0">
                            ¿Ya tienes cuenta? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--color-gold);">Inicia sesión aquí</a>
                        </p>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <footer></footer>

</body>
</html>
