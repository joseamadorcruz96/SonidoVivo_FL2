<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sonido Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Crear Cuenta</h2>
                        
                        <!-- Formulario con ID para capturarlo en JS -->
                        <form id="form-registro">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez">
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres">
                            </div>

                            <div class="mb-4">
                                <label for="confirmar-password" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmar-password" placeholder="Repite tu contraseña">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>
