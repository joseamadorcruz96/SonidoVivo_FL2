<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel | Sonido Vivo</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos Personalizados y Variables Corporativas -->
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Persistencia y Controladores -->
    <script src="js/db.js"></script>
    <script src="js/app.js" defer></script>
    <script src="js/carrito.js" defer></script>
    <script src="js/cliente.js" defer></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar navbar-expand-lg navbar-sonido-vivo" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/logo.svg" alt="Sonido Vivo - Instrumentos & Audio">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion"
                    aria-controls="menuNavegacion" aria-expanded="false" aria-label="Abrir navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link" href="blogs.html">Blogs</a></li>
                        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    </ul>

                    <div class="d-flex align-items-center gap-3">
                        <a href="carrito.html" class="btn-carrito-nav" id="boton-carrito-nav" title="Ver carrito de compras">
                            <span>🛒 Carrito</span>
                            <span id="contador-carrito" class="badge-carrito">0</span>
                        </a>
                        
                        <!-- Contenedor dinámico de sesión -->
                        <div id="menu-sesion" class="d-flex gap-2"></div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5 flex-grow-1">
        <!-- Título del Panel -->
        <div class="text-center mb-5">
            <h2 class="fw-bold" style="color: var(--color-gold); font-family: var(--font-heading);">Mi Panel de Cliente</h2>
            <p class="text-secondary">Gestiona tus compras y revisa tu historial de pedidos.</p>
        </div>

        <div class="row g-4">
            <!-- Columna Izquierda: Carrito de Compras -->
            <div class="col-lg-6">
                <div class="card shadow-lg h-100" style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" style="color: var(--text-main);">
                            🛒 Mi Carrito Actual
                        </h4>
                        
                        <!-- Lista de productos -->
                        <ul id="lista-carrito" class="list-group mb-4" style="border-radius: var(--radius-md);">
                        </ul>
                        
                        <!-- Resumen y Botón -->
                        <div class="d-flex justify-content-between align-items-center mb-4 pt-3" style="border-top: 1px solid var(--border-subtle);">
                            <h5 class="mb-0" style="color: var(--text-main);">Total a pagar:</h5>
                            <h4 class="mb-0 fw-bold" style="color: var(--color-gold);">$<span id="total-carrito">0</span></h4>
                        </div>
                        
                        <button id="btn-confirmar-pedido" onclick="realizarPedido()" class="btn btn-hero-gold w-100">
                            Confirmar Compra
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Historial de Pedidos -->
            <div class="col-lg-6">
                <div class="card shadow-lg h-100" style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" style="color: var(--text-main);">
                            📦 Mis Pedidos Anteriores
                        </h4>
                        
                        <!-- Tabla adaptada al modo oscuro -->
                        <div class="table-responsive">
                            <table class="table table-dark table-hover align-middle" style="background-color: transparent;">
                                <thead>
                                    <tr style="border-bottom: 2px solid var(--color-gold);">
                                        <th scope="col" style="color: var(--text-main); font-weight: 600;">ID Pedido</th>
                                        <th scope="col" style="color: var(--text-main); font-weight: 600;">Total</th>
                                        <th scope="col" style="color: var(--text-main); font-weight: 600;">Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-historial">
                                    <tr>
                                        <td colspan="3" class="text-center py-5 text-secondary">
                                            Aún no tienes pedidos registrados.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
